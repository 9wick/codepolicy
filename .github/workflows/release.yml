name: Release to release branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH for private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY_FOR_9WICK_ESLINT_RULES }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Unit tests (exclude LLM integration)
        run: bun run test --exclude='src/rules/*/rule.test.ts'

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY_FOR_9WICK_ESLINT_RULES }}

      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Switch to release branch
        run: |
          git fetch origin release || git switch --orphan release
          git switch release || git switch --orphan release

      - name: Sync tree from main
        run: git restore --source=origin/main --staged --worktree .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Remove dist from .gitignore
        run: sed -i '/^dist\/$/d' .gitignore

      - name: Commit and push
        env:
          LEFTHOOK: "0"
        run: |
          git add .
          git reset .gitignore
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update dist from main@$(git rev-parse --short origin/main)"
            git push origin release
          fi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
